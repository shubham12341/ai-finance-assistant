server:
  port: ${PORT:8082}

spring:
  application:
    name: finance-service

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: financedb

jwt:
  secret: ${JWT_SECRET}

ai:
  chat:
    service:
      url: ${AI_CHAT_SERVICE_URL}

management:
  endpoints:
    web:
      exposure:
        include: "*"